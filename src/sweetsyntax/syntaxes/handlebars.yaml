name: Handlebars
extension:
  - hbs
  - handlebars
  - mustache

block_comment:
  - '{{!--'
  - '--}}'

filters:
  - name: doctype
    pattern: "<![A-Za-z]+[A-Za-z ]*"
    group: 0
    attr: "markup.tag"
  - name: tag
    pattern: "(</?)([a-zA-Z][a-zA-Z0-9-]*)"
    group: 2
    attr: "markup.tag"
  - name: attribute
    pattern: "([a-zA-Z-]+)[ ]*="
    group: 1
    attr: "entity.other.attribute-name"
  - name: entity
    pattern: "&[A-Za-z]+;|&#[0-9]+;"
    group: 0
    attr: "constant.character.escape"
  - name: block_open
    pattern: "\\{\\{[#^/!][\\}\\}#\\-]*"
    group: 0
    attr: "markup.tag"
  - name: expression
    pattern: "\\{\\{[\\}\\}#\\-]*"
    group: 0
    attr: "markup.tag"

symbols:
  lt: '<'
  gt: '>'
  slash: '/'
  assign: '='
  not: '!'
  colon: ':'
  semicolon: ';'
  comma: ','
  amp: '&'
  pipe: '|'
  dot: '.'
  minus: '-'
  question: '?'
  hash: '#'
  at: '@'
  tilde: '~'
  quote: '"'
  squote: "'"
  backtick: '`'
  dollar: '$'
  percent: '%'
  plus: '+'

identifiers:
  if: "if"
  unless: "unless"
  each: "each"
  with: "with"
  else: "else"
  log: "log"
  lookup: "lookup"
  this: "this"
  true: "true"
  false: "false"
  null: "null"
  undefined: "undefined"

features:
  regex_literals: false
  async_await: false
  generators: false
  arrow_functions: false
  template_literals: false
  labeled_statements: false
