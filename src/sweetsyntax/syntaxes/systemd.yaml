# systemd unit files — highlight-only spec (lexer + renderers, no parser/AST).
#
# There is deliberately no `operators:` or `statements:` section: those drive the
# Pratt parser's precedence tables and statement handlers, and systemd units are
# supported for syntax highlighting only.
#
# Sections (`[Unit]`, `[Service]`, ...) and keys (`Description=`, ...) are
# styled two ways so both consumers agree:
#   - regex `filters` assign `entity.name.tag` / `property.name` when filters
#     run (`highlight`, the CLI);
#   - `identifiers` + `keyword_scopes` below assign the same scopes
#     (`entity.name.tag` / `variable.other.property`) from the lexer alone, so
#     filter-less consumers (the ZenCode backend runs `enableFilters = false`)
#     still highlight instead of rendering plain `variable` tokens.
# Unknown directives still match the key filter when filters run.
#
# Limitations, all from single-pass lexing rather than from this spec:
#   - `;` starts a comment anywhere on a line, not just at line start, so a
#     `;` inside an unquoted value ends the token stream for that line.
#   - Section blocks produce no fold region: folding only understands `{...}`
#     braces, so an indented body may report a presentational indent fold.

name: systemd
extension:
  - service
  - socket
  - timer
  - target
  - mount
  - automount
  - swap
  - path
  - slice
  - scope
  - device

inline_comment: ';'
hash_comments: true

# The section/key filters describe code structure, so `filters_skip_literals`
# keeps them from restyling a string or comment that merely contains one.
filters_skip_literals: true
filters:
  - name: section
    pattern: "\\[[A-Za-z][A-Za-z ]*\\]"
    group: 0
    attr: "entity.name.tag"
  - name: key
    pattern: "([A-Za-z][A-Za-z0-9]*)[ ]*="
    group: 1
    attr: "property.name"

symbols:
  assign: '='
  colon: ':'
  semicolon: ';'
  comma: ','
  dot: '.'
  plus: '+'
  minus: '-'
  multiply: '*'
  divide: '/'
  percent: '%'
  lt: '<'
  gt: '>'
  amp: '&'
  pipe: '|'
  tilde: '~'
  hash: '#'
  at: '@'
  dollar: '$'
  quote: '"'
  squote: "'"
  backslash: '\'
  slash: '/'
  sqbl: '['
  sqbr: ']'

