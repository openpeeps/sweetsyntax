name: XML
extension:
  - xml
  - xsd
  - xsl
  - xslt
  - svg
  - plist
  - pom

block_comment:
  - '<!--'
  - '-->'

filters:
  - name: doctype
    pattern: "<![A-Za-z]+[A-Za-z ]*"
    group: 0
    attr: "markup.tag"
  - name: processing_instruction
    pattern: "<\\?[a-zA-Z][a-zA-Z0-9-]*"
    group: 0
    attr: "markup.tag"
  - name: tag
    pattern: "(</?)([a-zA-Z_:][a-zA-Z0-9_:.-]*)"
    group: 2
    attr: "markup.tag"
  - name: attribute
    pattern: "([a-zA-Z_:][a-zA-Z0-9_:.-]*)[ ]*="
    group: 1
    attr: "entity.other.attribute-name"
  - name: entity
    pattern: "&[A-Za-z]+;|&#[0-9]+;"
    group: 0
    attr: "constant.character.escape"

symbols:
  lt: '<'
  gt: '>'
  slash: '/'
  assign: '='
  not: '!'
  colon: ':'
  semicolon: ';'
  comma: ','
  amp: '&'
  pipe: '|'
  dot: '.'
  minus: '-'
  question: '?'
  hash: '#'
  at: '@'
  tilde: '~'
  quote: '"'
  squote: "'"
  backtick: '`'
  dollar: '$'
  percent: '%'
  plus: '+'
  star: '*'

identifiers:
  true: "true"
  false: "false"
  null: "null"
  utf8: "UTF-8"
  xs: "xs"
  xsi: "xsi"

features:
  regex_literals: false
  async_await: false
  generators: false
  arrow_functions: false
  template_literals: false
  labeled_statements: false
