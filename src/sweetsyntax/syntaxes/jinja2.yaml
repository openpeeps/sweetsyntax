name: Jinja2
extension:
  - j2
  - jinja
  - jinja2
  - twig

block_comment:
  - '{#'
  - '#}'

filters:
  - name: doctype
    pattern: "<![A-Za-z]+[A-Za-z ]*"
    group: 0
    attr: "markup.tag"
  - name: tag
    pattern: "(</?)([a-zA-Z][a-zA-Z0-9-]*)"
    group: 2
    attr: "markup.tag"
  - name: attribute
    pattern: "([a-zA-Z-]+)[ ]*="
    group: 1
    attr: "entity.other.attribute-name"
  - name: entity
    pattern: "&[A-Za-z]+;|&#[0-9]+;"
    group: 0
    attr: "constant.character.escape"
  - name: expression
    pattern: "\\{\\{[\\}\\}#\\-]*"
    group: 0
    attr: "markup.tag"
  - name: statement
    pattern: "\\{%[#\\-]*"
    group: 0
    attr: "markup.tag"

symbols:
  lt: '<'
  gt: '>'
  slash: '/'
  assign: '='
  not: '!'
  colon: ':'
  semicolon: ';'
  comma: ','
  amp: '&'
  pipe: '|'
  dot: '.'
  minus: '-'
  question: '?'
  hash: '#'
  at: '@'
  tilde: '~'
  quote: '"'
  squote: "'"
  backtick: '`'
  dollar: '$'
  percent: '%'
  plus: '+'

identifiers:
  block: "block"
  endblock: "endblock"
  extends: "extends"
  include: "include"
  import: "import"
  from: "from"
  set: "set"
  with: "with"
  without: "without"
  macro: "macro"
  endmacro: "endmacro"
  filter: "filter"
  test: "test"
  is: "is"
  as: "as"
  in: "in"
  loop: "loop"
  if: "if"
  elif: "elif"
  else: "else"
  endif: "endif"
  for: "for"
  endfor: "endfor"
  recursive: "recursive"
  call: "call"
  raw: "raw"
  endraw: "endraw"
  self: "self"
  super: "super"
  true: "true"
  false: "false"
  none: "none"
  null: "null"
  and: "and"
  or: "or"
  not: "not"

features:
  regex_literals: false
  async_await: false
  generators: false
  arrow_functions: false
  template_literals: false
  labeled_statements: false
