name: Ruby
extension:
  - rb
  - ruby
  - rake
  - gemspec

inline_comment: '#'
trailing_bang_question: true

symbols:
  plus: '+'
  minus: '-'
  multiply: '*'
  divide: '/'
  modulo: '%'
  power: '**'
  assign: '='
  eq: '=='
  eqStrict: '==='
  ne: '!='
  notMatch: '!~'
  matchOp: '=~'
  not: '!'
  gt: '>'
  gte: '>='
  lt: '<'
  lte: '<='
  spaceship: '<=>'
  or: '||'
  andand: '&&'
  and: '&'
  orSingle: '|'
  xor: '^'
  tilde: '~'
  shiftLeft: '<<'
  shiftRight: '>>'
  plusAssign: '+='
  minusAssign: '-='
  multiplyAssign: '*='
  divideAssign: '/='
  moduloAssign: '%='
  powerAssign: '**='
  andAssign: '&='
  orAssign: '|='
  xorAssign: '^='
  andAndAssign: '&&='
  orOrAssign: '||='
  shiftLeftAssign: '<<='
  shiftRightAssign: '>>='
  arrow: '=>'
  safeNav: '&.'
  lambdaArrow: '->'
  parl: '('
  parr: ')'
  sqbl: '['
  sqbr: ']'
  curl: '{'
  curr: '}'
  squote: "'"
  quote: '"'
  colon: ':'
  scolon: ';'
  question: '?'
  comma: ','
  at: '@'
  atat: '@@'
  dollar: '$'
  backslash: '\\'
  dot: '.'
  range: '..'
  exclRange: '...'

identifiers:
  alias: "alias"
  and: "and"
  begin: "begin"
  break: "break"
  case: "case"
  class: "class"
  def: "def"
  defined: "defined?"
  do: "do"
  else: "else"
  elsif: "elsif"
  end: "end"
  ensure: "ensure"
  false: "false"
  for: "for"
  if: "if"
  in: "in"
  module: "module"
  next: "next"
  nil: "nil"
  not: "not"
  or: "or"
  redo: "redo"
  rescue: "rescue"
  retry: "retry"
  return: "return"
  self: "self"
  super: "super"
  then: "then"
  true: "true"
  undef: "undef"
  unless: "unless"
  until: "until"
  when: "when"
  while: "while"
  yield: "yield"
  __FILE__: "__FILE__"
  __LINE__: "__LINE__"
  __ENCODING__: "__ENCODING__"

blocks:
  open: ""
  close: ""

features:
  command_syntax: false

operators:
  prefix:
    - tokens: ["-", "+", "!", "~", "*", "**", "&"]
    - tokens: ["not"]
      is_keyword: true

  infix:
    - precedence: 1
      keywords: ["or"]
    - precedence: 2
      keywords: ["and"]
    - precedence: 3
      tokens: ["..", "..."]
    - precedence: 4
      tokens: ["|", "^"]
    - precedence: 5
      tokens: ["&"]
    - precedence: 6
      tokens: ["==", "!=", "===", "=~", "!~", "<=>"]
    - precedence: 7
      tokens: ["<", "<=", ">", ">="]
    - precedence: 8
      tokens: ["<<", ">>"]
    - precedence: 9
      tokens: ["+", "-"]
    - precedence: 10
      tokens: ["*", "/", "%"]
    - precedence: 11
      tokens: ["**"]
      assoc: right
    - precedence: 12
      tokens: [".", "&.", "::"]
      handler: dot
    - precedence: 13
      tokens: ["["]
      handler: bracket
    - precedence: 14
      tokens: ["("]
      handler: call

  assignment:
    tokens: ["=", "+=", "-=", "*=", "/=", "%=", "**=",
             "&&=", "||=", "<<=", ">>=", "&=", "|=", "^="]

  ternary:
    token: "?"
    separator: ":"
    precedence: 3

statements:
  def_stmt:
    keyword: "def"
    handler: def
  class_stmt:
    keyword: "class"
    handler: class
  module_stmt:
    keyword: "module"
    handler: module
  if_stmt:
    keyword: "if"
    handler: conditional
  unless_stmt:
    keyword: "unless"
    handler: conditional
  while_stmt:
    keyword: "while"
    handler: loop
  until_stmt:
    keyword: "until"
    handler: loop
  for_stmt:
    keyword: "for"
    handler: for_loop
  case_stmt:
    keyword: "case"
    handler: case
  begin_stmt:
    keyword: "begin"
    handler: begin
  return_stmt:
    keyword: "return"
    handler: return
  break_stmt:
    keyword: "break"
    handler: break
  next_stmt:
    keyword: "next"
    handler: next
  redo_stmt:
    keyword: "redo"
    handler: redo
  retry_stmt:
    keyword: "retry"
    handler: retry
  yield_stmt:
    keyword: "yield"
    handler: yield
  alias_stmt:
    keyword: "alias"
    handler: alias
  undef_stmt:
    keyword: "undef"
    handler: undef
  end_stmt:
    keyword: "end"
    handler: end
