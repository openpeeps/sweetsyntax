# D — highlight-only spec (lexer + renderers, no parser/AST).
#
# There is deliberately no `operators:` or `statements:` section: those drive the
# Pratt parser's precedence tables and statement handlers, and D is supported
# for syntax highlighting only.
#
# Limitations, all from single-pair lexing in the lexer rather than from this
# spec: D's block comments nest and also come in a `/+ +/` flavour, so only
# `/* */` is recognised here and `/+ +/` bodies highlight as code. The same
# applies to `/+! +/` doc comments, which are not detected as documentation.

name: D
extension:
  - d
  - di

inline_comment: '//'
block_comment:
  - '/*'
  - '*/'

# `10L`, `1u`, `0xFFUL`, `1.0f`
int_suffixes: true

# Backquotes delimit token strings (`` `ident` ``), which may span lines with
# no escapes or interpolation.
raw_strings: true

# `c"x"`, `w"x"`, `d"x"`, `r"x"`, `q"x"`, `hex"ff"` fold into one string
# token. The delimited forms (`q{...}`, `hex[...]`) are not recognised.
string_prefixes: ["c", "w", "d", "r", "q", "hex"]

symbols:
  plus: '+'
  minus: '-'
  multiply: '*'
  divide: '/'
  modulo: '%'
  power: '**'
  assign: '='
  eq: '=='
  ne: '!='
  lt: '<'
  lte: '<='
  gt: '>'
  gte: '>='
  and: '&'
  or: '|'
  xor: '^'
  not: '!'
  tilde: '~'
  shiftLeft: '<<'
  shiftRight: '>>'
  unsignedShiftRight: '>>>'
  plusAssign: '+='
  minusAssign: '-='
  multiplyAssign: '*='
  divideAssign: '/='
  moduloAssign: '%='
  powerAssign: '**='
  andAssign: '&='
  orAssign: '|='
  xorAssign: '^='
  shiftLeftAssign: '<<='
  shiftRightAssign: '>>='
  unsignedShiftRightAssign: '>>>='
  increment: '++'
  decrement: '--'
  arrow: '->'
  dot: '.'
  ellipsis: '...'
  parl: '('
  parr: ')'
  sqbl: '['
  sqbr: ']'
  curl: '{'
  curr: '}'
  squote: "'"
  quote: '"'
  backtick: '`'
  colon: ':'
  scolon: ';'
  comma: ','
  question: '?'
  hash: '#'
  at: '@'
  dollar: '$'

identifiers:
  abstract: "abstract"
  alias: "alias"
  align: "align"
  asm: "asm"
  assert: "assert"
  auto: "auto"
  body: "body"
  bool: "bool"
  break: "break"
