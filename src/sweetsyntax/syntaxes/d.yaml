  case: "case"
  cast: "cast"
  catch: "catch"
  cdouble: "cdouble"
  cent: "cent"
  cfloat: "cfloat"
  char: "char"
  class: "class"
  const: "const"
  continue: "continue"
  creal: "creal"
  dchar: "dchar"
  debug: "debug"
  default: "default"
  delegate: "delegate"
  delete: "delete"
  deprecated: "deprecated"
  do: "do"
  double: "double"
  else: "else"
  enum: "enum"
  export: "export"
  extern: "extern"
  false: "false"
  final: "final"
  finally: "finally"
  float: "float"
  for: "for"
  foreach: "foreach"
  foreach_reverse: "foreach_reverse"
