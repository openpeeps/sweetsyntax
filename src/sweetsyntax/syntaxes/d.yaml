# Keyword scopes give a keyword its TextMate scope. These live here so that
# each spec owns its own vocabulary and the renderer holds none of it; any
# identifier left out below still highlights, as a plain `keyword`.
keyword_scopes:
  storage.type: ["void", "bool", "byte", "ubyte", "short", "ushort", "int", "uint", "long", "ulong", "float", "double", "real", "ifloat", "idouble", "cfloat", "cdouble", "ireal", "creal", "char", "wchar", "dchar", "string", "size_t", "ptrdiff_t", "cent", "ucent", "auto"]
  storage.modifier: ["const", "immutable", "inout", "out", "ref", "scope", "static", "extern", "override", "abstract", "final", "pure", "nothrow", "shared", "lazy", "align", "deprecated", "version", "unittest", "__gshared", "__vector", "__parameters"]
  keyword.control: ["if", "else", "while", "for", "foreach", "foreach_reverse", "switch", "case", "default", "break", "continue", "return", "goto", "do", "try", "catch", "finally", "throw", "with", "invariant", "assert", "body", "asm", "cast", "new", "delete", "is", "in", "mixin", "template", "debug"]
  keyword: ["module", "import", "export", "package", "alias", "enum", "struct", "union", "class", "interface", "delegate", "function", "macro", "pragma", "typeid", "typedef", "typeof", "synchronized"]
  constant.language.boolean: ["true", "false"]
  constant.language.null: ["null"]
  constant.language: ["__FILE__", "__LINE__", "__traits"]
  variable.language: ["this", "super"]

blocks:
  open: "{"
  close: "}"

features:
  regex_literals: false
  async_await: false
  generators: false
  arrow_functions: false
  template_literals: false
  labeled_statements: true
  adjacent_concat: false