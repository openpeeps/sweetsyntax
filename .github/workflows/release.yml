name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release and publish to npm (e.g. 0.2.4)'
        required: true
        type: string
jobs:
  napi:
    name: napi addons
    uses: nimbase/setup-nim-action/.github/workflows/release_clue.yml@main
    with:
      app-name: node_addon
      nim-version: '2.2.x'
      package-manager: nimble
      test: true
      test-flags: '-d:release'
      pre-build-command: >-
        cd .. && nimble install denim -y &&
        (npm install -g cmake-js ||
        (npm install --prefix "$HOME/.cmake-js" cmake-js &&
        echo "$HOME/.cmake-js/bin" >> "$GITHUB_PATH"))
      build-command: denim build src/sweetsyntax.nim --cmake -y && node addons/sweetsyntax_napi/scripts/place-binary.js && npm test --prefix addons/sweetsyntax_napi
      binary: bin/sweetsyntax.node
      target-matrix: '[{"os":"macos-14","arch":"arm64"},{"os":"macos-15-intel","arch":"x86_64"},{"os":"ubuntu-24.04","arch":"x86_64"},{"os":"ubuntu-24.04-arm","arch":"arm64"}]'
      create-release: true

  npm-publish:
    name: npm publish
    runs-on: ubuntu-latest
    needs: napi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true

      - name: Assemble per-arch binaries
        shell: bash
        run: |
          set -eu
          pkg=addons/sweetsyntax_napi
          declare -A slots=(
            [node_addon_macos-arm64.tar.gz]=darwin-arm64
            [node_addon_macos-x86_64.tar.gz]=darwin-x64
            [node_addon_linux-x86_64.tar.gz]=linux-x64
            [node_addon_linux-arm64.tar.gz]=linux-arm64
          )
          for archive in "${!slots[@]}"; do
            [[ -f "dist/${archive}" ]] || { echo "ERROR: missing ${archive}"; exit 1; }
            work="$(mktemp -d)"
            tar xzf "dist/${archive}" -C "${work}"
            node_bin="$(find "${work}" -name 'sweetsyntax.node' | head -n 1)"
            [[ -n "${node_bin}" ]] || { echo "ERROR: no sweetsyntax.node in ${archive}"; exit 1; }
            dest="${pkg}/bin/${slots[${archive}]}"
            mkdir -p "${dest}"
            cp "${node_bin}" "${dest}/sweetsyntax.node"
            rm -rf "${work}"
          done
          find "${pkg}/bin" -name '*.node' | sort

      - name: Sync version from input
        working-directory: addons/sweetsyntax_napi
        shell: bash
        run: |
          set -eu
          version="${VERSION#v}"
          echo "Syncing npm version to ${version}"
          npm pkg set version="${version}"
          node -p "require('./package.json').version"
        env:
          VERSION: ${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Smoke test assembled package
        shell: bash
        run: npm test --prefix addons/sweetsyntax_napi

      - name: Publish to npm
        working-directory: addons/sweetsyntax_napi
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
